name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches manifest.json version
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/qbt/manifest.json"))["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qbittorrent-api pytest-homeassistant-custom-component ruff
      - name: Ruff
        run: ruff check custom_components/ tests/
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' \
            CHANGELOG.md > notes.md
          test -s notes.md
      # hacs.json has zip_release: false, so HACS installs custom_components/qbt
      # from the tagged source; the release needs no assets.
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
